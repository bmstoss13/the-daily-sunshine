version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/schema.sql"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        overrides: 
          # - db_type: "timestamptz"
          #   go_type: "time.Time"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true